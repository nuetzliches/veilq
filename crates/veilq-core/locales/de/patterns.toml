# Built-in patterns for German (ADR-0010), detector `pattern:de.<name>`.
# Format: a policy's [[patterns]] (ADR-0011). Names are found by the words
# around them until NER comes (M3): a salutation, a role, a signature.

[[patterns]]
name = "name-salutation"
entity = "PERSON"
regex = '\b(?:Herrn?|Frau|Hr\.|Fr\.)\s+(?:(?:Dr\.|Prof\.)\s+)*(?P<pii>\p{Lu}\p{Ll}+(?:[- ]\p{Lu}\p{Ll}+)?)'
confidence = 0.85

[[patterns]]
name = "name-role"
entity = "PERSON"
regex = '\b(?:Hallo|Liebe[rs]?|Sehr geehrte[rs]?|Kontoinhaber(?:in)?|Ansprechpartner(?:in)?|Mandant(?:in)?|Bruder|Schwester|Ehemann|Ehefrau|Sohn|Tochter|Vater|Mutter|Sachbearbeiter(?:in)?|Sachbearbeitung|Bearbeiter(?:in)?|Kläger(?:in)?|Beklagte[rn]?|Zeugin|Zeuge|Patient(?:in)?|Mieter(?:in)?|Vermieter(?:in)?|Schuldner(?:in)?|Gläubiger(?:in)?|Kunde|Kundin|zu Händen|z\. ?Hd\.?)[:,]?\s+(?:von\s+|vom\s+)?(?P<pii>\p{Lu}\p{Ll}+(?:[- ]\p{Lu}\p{Ll}+){1,2})'
confidence = 0.8

# One given name after a greeting, when a comma, `!`, `:` or the line end
# follows: `Hallo Ayşe,`, `Liebe Lena!`. What follows a greeting without
# being a name (`Liebe Grüße`, `Hallo Team!`, `Liebe Kollegen,`) is a role
# word (`detect::NOT_NAMES`) and dropped.
[[patterns]]
name = "name-greeting"
entity = "PERSON"
regex = '(?m)\b(?:Hallo|Hi|Hey|Moin|Servus|Liebe[rs]?|Sehr geehrte[rs]?|Guten Tag)[ \t]+(?P<pii>\p{Lu}\p{Ll}+)[ \t]*(?:[,!:]|\r?$)'
confidence = 0.8

# One given name after a kinship word with a possessive: `mein Bruder Ali`,
# `meine Schwester Lena`.
[[patterns]]
name = "name-kin"
entity = "PERSON"
regex = '\b(?:[Mm]ein|[Dd]ein|[Ss]ein|[Uu]nser|[Ee]uer|[Ii]hr)e?[mnrs]?\s+(?:Bruder|Schwester|Sohn|Tochter|Vater|Mutter|Mann|Frau|Ehemann|Ehefrau|Onkel|Tante|Cousin|Cousine|Neffe|Nichte|Oma|Opa|Enkel|Enkelin|Freund|Freundin|Partner|Partnerin)\s+(?P<pii>\p{Lu}\p{Ll}+)'
confidence = 0.8

# A self-introduction: `ich heiße Mehmet`, `Mein Name ist Ayşe`, also
# misspelt (`ich heise`, `ich heisse`).
[[patterns]]
name = "name-self"
entity = "PERSON"
regex = '(?i:\bich\s+hei(?:ß|ss|s)e|\bmein\s+name\s+ist)\s+(?P<pii>\p{Lu}\p{Ll}+)'
confidence = 0.85
validate = "given_name_de"

# The same in a message written in lower case: `ich heisse ayşe`.
[[patterns]]
name = "name-self-lower"
entity = "PERSON"
regex = '(?i:\bich\s+hei(?:ß|ss|s)e|\bmein\s+name\s+ist)\s+(?P<pii>\p{Ll}+)'
confidence = 0.75
validate = "given_name_de"

# `Ich bin Lena und …`: only before `und`, a comma or the line end, as
# `ich bin` is followed by much else (`Ich bin Lehrer und …` is a false
# positive fail closed takes).
[[patterns]]
name = "name-self-bin"
entity = "PERSON"
regex = '(?m)\b[Ii]ch\s+bin\s+(?P<pii>\p{Lu}\p{Ll}+)(?:[ \t]*,|[ \t]+und\b|[ \t]*\r?$)'
confidence = 0.75
validate = "given_name_de"

[[patterns]]
name = "name-signature"
entity = "PERSON"
regex = '(?m)(?:Grüße|Grüßen|Gruß|Grüsse|Grüssen|Gruss)[,!.]?[ \t]*\r?\n(?:[ \t]*\r?\n)?[ \t]*(?P<pii>\p{Lu}\p{Ll}+(?:[- ]\p{Lu}\p{Ll}+){1,2})[ \t]*\r?$'
confidence = 0.8

# Street, number, postcode and place: `Lindenweg 12, 28195 Bremen`. The
# street word may be a word of its own: `Trebuser Str. 3d 15517 Fürstenwalde`.
[[patterns]]
name = "address"
entity = "ADDRESS"
regex = '\b\p{Lu}[\p{L}.\-]*?(?:straße|strasse|str\.|weg|gasse|platz|allee|ring|damm|ufer|steig|pfad|chaussee|markt|graben|wall|hof|berg|feld|garten| (?:Straße|Strasse|Str\.|Weg|Gasse|Platz|Allee|Ring|Damm|Ufer|Chaussee|Markt|Graben|Wall))\s+\d{1,4}\s?[a-zA-Z]?(?:\s?-\s?\d{1,4})?(?:,\s*|[ \t]*\r?\n[ \t]*|\s+)\d{5}\s+\p{Lu}[\p{L}\-]+(?:\s+(?:an der|am|im|in der)\s+\p{Lu}\p{L}+)?(?: \p{Lu}[\p{L}\-]+){0,2}'
confidence = 0.9

# A street without a street word (`Alte Mühle 3`, `Am Markt 4`, `Auf der
# Höhe 9`), known by its number, a comma and a postcode: `Am Anger 7, 15938
# Lindau Ost-Heide`. Up to four words before the number, the small ones of a
# street's name among them, and three after; single spaces only: a picture's
# row joins its lines with two, and the next line is not the town.
[[patterns]]
name = "address-postcode"
entity = "ADDRESS"
regex = '\b\p{Lu}[\p{L}.\-]*(?: (?:\p{Lu}[\p{L}.\-]*|an|am|auf|aus|bei|beim|der|die|das|den|dem|des|im|in|hinter|über|unter|vor|vom|von|zu|zum|zur)){0,3} \d{1,4} ?[a-zA-Z]?, ?\d{5} \p{Lu}[\p{L}\-]+(?: \p{Lu}[\p{L}\-]+){0,2}'
confidence = 0.85

# A letter's address block: the street and number on a line of their own,
# the postcode and the town on the next (`Auf der Höhe 9` / `15938
# Lindau`). Two lines that hold nothing else say what they are without a
# street word.
[[patterns]]
name = "address-lines"
entity = "ADDRESS"
regex = '(?m)^[ \t]*(?P<pii>\p{Lu}[\p{L}.\-]*(?: (?:\p{Lu}[\p{L}.\-]*|an|am|auf|aus|bei|beim|der|die|das|den|dem|des|im|in|hinter|über|unter|vor|vom|von|zu|zum|zur)){0,3} \d{1,4} ?[a-zA-Z]?(?: ?- ?\d{1,4})?[ \t]*\r?\n[ \t]*\d{5} \p{Lu}[\p{L}\-]+(?: (?:an der|am|im|in der) \p{Lu}\p{L}+)?(?: \p{Lu}[\p{L}\-]+){0,2})[ \t]*\r?$'
confidence = 0.85

# A street and number alone, when the text says it is an address.
[[patterns]]
name = "street"
entity = "ADDRESS"
regex = '\b\p{Lu}[\p{L}\-]*?(?:straße|strasse|str\.|weg|gasse|platz|allee|ring|damm|ufer|steig|pfad|chaussee| (?:Straße|Strasse|Str\.|Weg|Gasse|Platz|Allee|Ring|Damm|Ufer|Chaussee))\s+\d{1,4}\s?[a-zA-Z]?\b'
confidence = 0.5
context = { words = ["anschrift", "adresse", "wohnhaft", "wohnt", "straße", "strasse", "lieferadresse", "address", "street"], boost = 0.35, window = 32 }

# A table's row: street, number, postcode and town in cells of their own,
# as a picture's row joins them (two spaces). A screen cuts a long cell
# (`Hachenburg …`, `Fürstenwal ..`), and OCR may read the dots as a cell of
# their own (`Siedlungsstr  ( ..`), a letter after the number as another
# sign (`50€` for `50c`) and a cut town's dots as one (`Frankfurt a .`):
# the number, the postcode and the town after it say what the first cell is.
[[patterns]]
name = "address-columns"
entity = "ADDRESS"
regex = '\b\p{Lu}[\p{L}.\-]*(?: [\p{L}.\-]+){0,3}(?: {1,3}\(? ?(?:\.{2,3}|…)\.?)? {2,}\d{1,4} ?[^\s\d]? {2,}\d{5} {2,}\p{Lu}[\p{L}\-]+(?: [\p{L}\-]+){0,2}(?: {0,3}(?:\.{1,3}|…)\.?)?'
confidence = 0.85

# A whole value under a column that names a street (`Straße`, `Anschrift`):
# a table keeps the number, the postcode and the town in columns of their
# own, and the street cell may be cut (`Hachenburg …`). Without such a
# column it is no candidate (confidence 0): a value of any shape would
# claim its span.
[[patterns]]
name = "street-field"
entity = "ADDRESS"
regex = '^\p{Lu}[\p{L}.\-]*(?: [\p{L}.\-]+){0,3}(?: \d{1,4} ?[a-zA-Z]?)?(?: ?\(? ?(?:\.{2,3}|…)\.?)?$'
confidence = 0.0
context = { words = ["straße", "strasse", "str.", "street", "anschrift", "adresse", "address"], boost = 0.85, window = 32 }

# National numbers: 0 and an area code. Not after a digit and `-` or `/`,
# so that `2026-0421-5550` (an invoice number) stays. At least three digits
# after the area code: a postcode (`01067`) is not a number. No area code
# starts with 0 and no country code either: `000496/2026` is an invoice's.
[[patterns]]
name = "phone"
entity = "PHONE_NUMBER"
regex = '(?:^|[^\w\-/.+])(?P<pii>0(?:0[1-9]|[1-9]\d)\d{0,3}[ \t/-]?\d{3,9}(?:[ \t/-]?\d{1,9}){0,2})(?:$|[^\w\-/.]|\.(?:\D|$))'
confidence = 0.75
context = { words = ["tel", "telefon", "phone", "mobil", "handy", "fax", "rückruf", "erreichbar", "anruf"], boost = 0.2 }

# A date is personal data as a birth date: below the threshold unless a word
# such as `geb.` or the column `geburtsdatum` says so.
[[patterns]]
name = "birth-date"
entity = "DATE_OF_BIRTH"
regex = '\b(?:(?:0?[1-9]|[12]\d|3[01])\.(?:0?[1-9]|1[0-2])\.(?:19|20)?\d{2}|(?:19|20)\d{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12]\d|3[01])|(?:0?[1-9]|[12]\d|3[01])\.\s?(?:Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)\s(?:19|20)\d{2})\b'
confidence = 0.3
validate = "date"
context = { words = ["geb.", "geboren", "geburtsdatum", "geburtstag", "geburt", "birth", "born", "dob"], boost = 0.6, window = 40 }

[[patterns]]
name = "tax-id"
entity = "TAX_ID"
regex = '\b\d{2}[ ]?\d{3}[ ]?\d{3}[ ]?\d{3}\b'
confidence = 0.65
validate = "tax_id_de"
context = { words = ["steuer", "steuer-id", "steuerid", "steueridentifikationsnummer", "identifikationsnummer", "idnr", "tin", "tax"], boost = 0.35 }

[[patterns]]
name = "social-security"
entity = "SOCIAL_SECURITY_NUMBER"
regex = '\b\d{2}[ ]?\d{6}[ ]?[A-Z][ ]?\d{3}\b'
confidence = 0.7
validate = "ssn_de"
context = { words = ["rentenversicherung", "sozialversicherung", "versicherungsnummer", "sv-nummer", "svnr", "rvnr"], boost = 0.25 }

[[patterns]]
name = "id-card"
entity = "ID_CARD_NUMBER"
regex = '\b[CFGHJKLMNPRTVWXYZ][CFGHJKLMNPRTVWXYZ0-9]{8}\d?\b'
confidence = 0.35
validate = "id_card_de"
context = { words = ["ausweis", "personalausweis", "ausweisnummer", "reisepass", "passnummer", "dokumentennummer"], boost = 0.55 }

[[patterns]]
name = "licence-plate"
entity = "LICENSE_PLATE"
regex = '\b\p{Lu}{1,3}[- ]\p{Lu}{1,2}[ ]?[1-9]\d{0,3}[EH]?\b'
confidence = 0.7
validate = "kfz_de"
context = { words = ["kennzeichen", "kfz", "fahrzeug", "pkw", "lkw", "nummernschild"], boost = 0.3 }

# Court file numbers: `3 O 128/26`, `VI ZR 12/25`.
[[patterns]]
name = "court-file"
entity = "COURT_FILE_NUMBER"
regex = '\b(?:\d{1,3}|[IVX]{1,5})\s?[A-Z][A-Za-z]{0,3}\s?\d{1,5}/\d{2}\b'
confidence = 0.6
context = { words = ["az", "aktenzeichen", "geschäftszeichen", "akte", "verfahren"], boost = 0.35 }
