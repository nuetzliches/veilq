[package]
name = "veilq-core"
description = "Detection and redaction engine of veilq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
age = "0.12"
base64 = "0.23"
flate2 = "1"
hmac = "0.13.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "image_025", "thread_safe"], optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"], optional = true }
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4", default-features = false }
thiserror = "2.0.21"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
toml = "1.2.1"
unicode-normalization = "0.1.26"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# NER (ADR-0022): a GLiNER model in ONNX; ONNX Runtime is loaded at run time,
# nothing is downloaded when veilq is built.
ner = ["models", "dep:tokenizers"]
# OCR (ADR-0023): PaddleOCR in ONNX for images, GIF and PDF pages.
ocr = ["models"]
# PDF (ADR-0023): pages rendered with PDFium, loaded at run time, then read
# with OCR.
pdf = ["ocr", "dep:pdfium-render"]
# ONNX Runtime, loaded at run time.
models = ["dep:ort"]
