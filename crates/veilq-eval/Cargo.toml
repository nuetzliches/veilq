[package]
name = "veilq-eval"
description = "The synthetic evaluation corpus of veilq: generator, ground truth, recall gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ab_glyph = "0.2.32"
anyhow.workspace = true
base64 = "0.23"
clap.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
veilq-core.workspace = true
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
default = ["ner", "ocr"]
# `check --ner` runs the NER model when it is installed.
ner = ["veilq-core/ner"]
# `check --ocr` reads the corpus's pictures with the installed OCR (and
# PDFium for its PDFs).
ocr = ["veilq-core/pdf"]

[lints]
workspace = true
