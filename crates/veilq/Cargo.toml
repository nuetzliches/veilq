[package]
name = "veilq"
description = "Find and redact personal data in text, documents, images and screen recordings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", optional = true }
base64 = { version = "0.23.1", optional = true }
clap.workspace = true
getrandom = "0.4.3"
include_dir = { version = "0.7.4", optional = true }
rmcp = { version = "3.9", features = ["server", "macros", "transport-io", "transport-streamable-http-server"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "macros", "signal"], optional = true }
veilq-core.workspace = true

[target.'cfg(windows)'.dependencies]
# veilq's own window (ADR-0029): WebView2 through wry, the window by tao.
image = { version = "0.25", default-features = false, features = ["png"] }
mslnk = "0.1.8"
tao = "0.37.2"
wry = "0.57.2"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
winreg = "0.56.0"

[build-dependencies]
embed-resource = "3.0.12"

[lints]
workspace = true

[features]
default = ["ui", "mcp", "ner", "ocr", "pdf"]
# NER (ADR-0022): runs when `veilq models fetch ner` installed it.
ner = ["veilq-core/ner"]
# OCR (ADR-0023): runs when `veilq models fetch ocr` installed it.
ocr = ["veilq-core/ocr"]
# PDF (ADR-0023): runs when `veilq models fetch pdf` installed PDFium, and OCR.
pdf = ["ocr", "veilq-core/pdf"]
# `veilq mcp`: the MCP server over stdio and HTTP (ADR-0016).
mcp = ["dep:rmcp", "dep:axum", "dep:tokio", "dep:base64"]
# `veilq ui`: the local web UI (ADR-0008). Embeds `ui/dist` when it was built.
ui = ["dep:axum", "dep:tokio", "dep:include_dir", "dep:base64"]

[dev-dependencies]
age = "0.12"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
