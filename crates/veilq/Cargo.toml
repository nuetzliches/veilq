[package]
name = "veilq"
description = "Find and redact personal data in text, documents, images and screen recordings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", optional = true }
base64 = { version = "0.23.1", optional = true }
clap.workspace = true
getrandom = { version = "0.4.3", optional = true }
include_dir = { version = "0.7.4", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "macros", "signal"], optional = true }
veilq-core.workspace = true

[lints]
workspace = true

[features]
default = ["ui"]
# `veilq ui`: the local web UI (ADR-0008). Embeds `ui/dist` when it was built.
ui = ["dep:axum", "dep:tokio", "dep:include_dir", "dep:getrandom", "dep:base64"]

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
