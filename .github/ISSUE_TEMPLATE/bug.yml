name: Bug
description: An error, a crash, a broken output file.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Synthetic data only**, never the input that failed."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Synthetic reproduction
      description: Command, format, a made-up input; the error message.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: veilq version, platform, installed models
      description: "`veilq --version`, the OS, `veilq models list`"
