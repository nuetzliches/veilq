name: ci

# Actions are pinned by commit SHA (the comment names the release);
# Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked --no-fail-fast

  eval:
    # Recall and precision against the synthetic corpus (eval/) and against
    # corpora of seeds that are generated here only: decided on, never tuned
    # on (ADR-0013, ADR-0014). The gate is eval/gate.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # One release cache for both eval jobs; eval-models, which builds the
      # more of the two, saves it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: false
      - name: gate
        run: cargo run --release --locked -p veilq-eval -- check eval --held-out 7001,7002,7003,7004,7005 --list 0

  eval-models-part:
    # The same corpus with the pinned models (ADR-0022, ADR-0023): NER, OCR
    # and PDFium, fetched by veilq itself from their pinned URLs and checked
    # against their SHA-256. They are cached by the pins alone (the URLs and
    # checksums in models.rs), saved from main only: a pull request that
    # changes other code in models.rs restores them and saves nothing. The
    # pictures of the corpus are read too; the gate is eval/gate-ner.toml.
    # The models use every core of a runner, so the held-out seeds are
    # spread over three runners instead; each checks the corpus too.
    name: eval-models (${{ matrix.seeds }})
    strategy:
      fail-fast: false
      matrix:
        seeds: ["7001,7002", "7003,7004", "7005"]
    runs-on: ubuntu-latest
    env:
      VEILQ_MODEL_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # One part saves the release cache, which eval shares.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.seeds == '7005' }}
      - name: pins
        id: pins
        shell: bash
        run: |
          pins=$(grep -E 'https://|sha256:|file:|name:|member:|target:' crates/veilq-core/src/models.rs | sha256sum | cut -c1-16)
          echo "key=veilq-models-${{ runner.os }}-$pins" >> "$GITHUB_OUTPUT"
      - name: models cache
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: ${{ steps.pins.outputs.key }}
      - name: build
        run: cargo build --release --locked -p veilq -p veilq-eval
      - name: fetch models
        if: steps.models.outputs.cache-hit != 'true'
        run: for m in ner ocr pdf; do target/release/veilq models fetch "$m"; done
      - name: save models
        if: steps.models.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && matrix.seeds == '7005'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: ${{ steps.pins.outputs.key }}
      - name: gate
        run: |
          target/release/veilq models list
          target/release/veilq-eval check eval --ner --ocr --gate eval/gate-ner.toml --held-out ${{ matrix.seeds }} --list 20

  eval-models:
    # The check the branch protection names: all parts passed.
    needs: eval-models-part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: all parts passed
        run: test "${{ needs.eval-models-part.result }}" = success

  ui:
    # The web UI (ui/) that `veilq ui` embeds: types, unit tests, build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  msrv:
    # The rust-version Cargo.toml promises.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: echo "version=$(grep -m1 '^rust-version = ' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: check
        run: cargo check --workspace --all-targets --locked

  deny:
    # Licences and sources of every dependency (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources
      - name: advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: true
        with:
          command: check advisories
