name: release

# A tag v<version> builds veilq for Windows, Linux (x86_64, arm64) and macOS
# (Apple Silicon, Intel) and publishes a GitHub release with the archives,
# SHA256SUMS and a build provenance attestation for each of them
# (`gh attestation verify <file> --repo nuetzliches/veilq`). Asset names
# carry no version, so ".../releases/latest/download/<asset>" stays stable.
#
# Linux builds link glibc, not musl: veilq loads ONNX Runtime and PDFium
# (glibc builds) at run time (ADR-0022, ADR-0023). The models and those
# libraries are not in the archives: `veilq models fetch` downloads them,
# pinned in the binary. macOS on Intel has no pinned ONNX Runtime and PDFium,
# so NER, OCR and PDF are unavailable there; patterns work.
#
# workflow_dispatch and pull requests that change this file build the same
# archives without publishing (dry run). The release's text is the
# changelog's section of its version (scripts/release-notes.sh).
#
# Actions are pinned by commit SHA (the comment names the release);
# Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release-notes.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    # The web UI is the same for every target: build it once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: build
        working-directory: ui
        run: npm ci && npm run build
      # What ships has no known advisory.
      - name: npm audit
        working-directory: ui
        run: npm audit --omit=dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist

  advisories:
    # No dependency with a known advisory goes into a release (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  build:
    needs: ui
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: veilq-x86_64-pc-windows-msvc.zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: veilq-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: veilq-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: veilq-aarch64-apple-darwin.tar.gz
          - os: macos-15
            target: x86_64-apple-darwin         # built on Apple Silicon, not run there
            archive: veilq-x86_64-apple-darwin.tar.gz
            cross: true
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: tag matches the crate and UI versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "v$crate" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != Cargo.toml version $crate"; exit 1; }
          ui=$(grep -m1 '"version":' ui/package.json | cut -d'"' -f4)
          [ "v$ui" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != ui/package.json version $ui"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - name: build
        run: cargo build --release --locked -p veilq --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release
          mkdir -p dist
          if [ "${{ matrix.os }}" = windows-latest ]; then
            7z a -tzip "dist/${{ matrix.archive }}" "./$dir/veilq.exe" README.md LICENSE-MIT LICENSE-APACHE
          else
            tar -czf "dist/${{ matrix.archive }}" -C "$dir" veilq -C "$GITHUB_WORKSPACE" README.md LICENSE-MIT LICENSE-APACHE
          fi
          if [ "${{ matrix.cross }}" = true ]; then
            file "$dir/veilq"
          else
            "$dir/veilq${{ matrix.os == 'windows-latest' && '.exe' || '' }}" --version
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/veilq-${{ matrix.target }}*

  notes:
    # The release's text is the changelog's section of its version: a tag
    # without one is refused before anything is published, a dry run checks
    # the version in the tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the changelog has a section for this release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          fi
          echo "### Release notes of $version" >> "$GITHUB_STEP_SUMMARY"
          sh scripts/release-notes.sh "$version" | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [build, advisories, notes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed attestation per file (Sigstore, OIDC).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only what reached main is released: a tag on any other commit stops
      # here.
      - name: the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${GITHUB_REF_NAME} ($GITHUB_SHA) is not on main"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: checksums
        run: (cd dist && sha256sum veilq-* > SHA256SUMS && cat SHA256SUMS)
      - name: build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/veilq-*
            dist/SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        # --verify-tag: only a tag that exists in the repository is released.
        run: |
          sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
          printf '\n**Full changelog:** https://github.com/%s/blob/%s/CHANGELOG.md\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "veilq ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
