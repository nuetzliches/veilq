name: release

# A tag v<version> builds veilq for Windows, Linux (x86_64, arm64) and macOS
# (Apple Silicon) and publishes a GitHub release with the archives,
# SHA256SUMS and a build provenance attestation for each of them
# (`gh attestation verify <file> --repo nuetzliches/veilq`). Asset names
# carry no version, so ".../releases/latest/download/<asset>" stays stable.
#
# Linux builds link glibc, not musl: veilq loads ONNX Runtime and PDFium
# (glibc builds) at run time (ADR-0022, ADR-0023). The models and those
# libraries are not in the archives: `veilq models fetch` downloads them,
# pinned in the binary. There is no build for macOS on Intel: ONNX Runtime
# publishes none for it, so NER, OCR and PDF could not run there (#53).
#
# workflow_dispatch and pull requests that change this file build the same
# archives without publishing (dry run). The release's text is the
# changelog's section of its version (scripts/release-notes.sh).
#
# Actions are pinned by commit SHA (the comment names the release);
# Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release-notes.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    # The web UI is the same for every target: build it once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: build
        working-directory: ui
        run: npm ci && npm run build
      # What ships has no known advisory.
      - name: npm audit
        working-directory: ui
        run: npm audit --omit=dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist

  advisories:
    # No dependency with a known advisory goes into a release (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  build:
    needs: ui
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: veilq-x86_64-pc-windows-msvc.zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: veilq-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: veilq-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: veilq-aarch64-apple-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: tag matches the crate and UI versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "v$crate" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != Cargo.toml version $crate"; exit 1; }
          ui=$(grep -m1 '"version":' ui/package.json | cut -d'"' -f4)
          [ "v$ui" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != ui/package.json version $ui"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - name: build
        run: cargo build --release --locked -p veilq --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release
          mkdir -p dist
          if [ "${{ matrix.os }}" = windows-latest ]; then
            7z a -tzip "dist/${{ matrix.archive }}" "./$dir/veilq.exe" README.md LICENSE-MIT LICENSE-APACHE
            # The program alone too, for a double click without unpacking
            # (ADR-0027): releases/latest/download/veilq.exe stays its link.
            cp "$dir/veilq.exe" dist/veilq.exe
          else
            tar -czf "dist/${{ matrix.archive }}" -C "$dir" veilq -C "$GITHUB_WORKSPACE" README.md LICENSE-MIT LICENSE-APACHE
          fi
          "$dir/veilq${{ matrix.os == 'windows-latest' && '.exe' || '' }}" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: |
            dist/veilq-${{ matrix.target }}*
            dist/veilq.exe

  sign-macos:
    # Developer ID signature and notarization (#10, ADR-0035), on a tag and
    # only while the repository variable SIGN_MACOS is `true`; then a
    # release without a valid signature fails. The secrets live in the
    # `release` environment only: a pull request's dry run never sees them.
    # A bare binary cannot carry its notarization ticket (no staple):
    # Gatekeeper looks it up online.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGN_MACOS == 'true'
    runs-on: macos-15
    environment: release
    strategy:
      matrix:
        target: [aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist
      - name: sign and notarize
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          for v in CERTIFICATE_P12 CERTIFICATE_PASSWORD IDENTITY NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER; do
            [ -n "${!v}" ] || { echo "::error::SIGN_MACOS is on, but the secret for $v is missing"; exit 1; }
          done
          keychain="$RUNNER_TEMP/sign.keychain-db"
          kpass=$(openssl rand -hex 16)
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" > /dev/null
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"

          archive="dist/veilq-${{ matrix.target }}.tar.gz"
          work="$RUNNER_TEMP/veilq"
          mkdir -p "$work"
          tar -xzf "$archive" -C "$work"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$work/veilq"
          codesign --verify --strict --verbose=2 "$work/veilq"
          ditto -c -k "$work/veilq" "$RUNNER_TEMP/veilq.zip"
          xcrun notarytool submit "$RUNNER_TEMP/veilq.zip" --wait --output-format json \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            | tee "$RUNNER_TEMP/notary.json"
          grep -q '"status":"Accepted"' "$RUNNER_TEMP/notary.json" || {
            echo "::error::notarization was not accepted"; exit 1; }
          rm "$RUNNER_TEMP/notary.p8"
          tar -czf "$archive" -C "$work" veilq README.md LICENSE-MIT LICENSE-APACHE
          security delete-keychain "$keychain"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/veilq-${{ matrix.target }}*
          overwrite: true

  check-windows:
    # Whether veilq.exe carries a valid Authenticode signature (#10,
    # ADR-0035). The signing step itself comes with the choice of a
    # provider; until then SIGN_WINDOWS stays off and this only reports.
    # With SIGN_WINDOWS `true`, a release without a valid signature fails.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-x86_64-pc-windows-msvc
          path: dist
      - name: signature
        shell: pwsh
        env:
          REQUIRED: ${{ vars.SIGN_WINDOWS }}
        run: |
          $sig = Get-AuthenticodeSignature dist/veilq.exe
          "veilq.exe: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            if ($env:REQUIRED -eq 'true') { "::error::veilq.exe has no valid signature"; exit 1 }
            "::notice::veilq.exe is not signed (SIGN_WINDOWS is off)"
          }

  notes:
    # The release's text is the changelog's section of its version: a tag
    # without one is refused before anything is published, a dry run checks
    # the version in the tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the changelog has a section for this release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          fi
          echo "### Release notes of $version" >> "$GITHUB_STEP_SUMMARY"
          sh scripts/release-notes.sh "$version" | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [build, advisories, notes, sign-macos, check-windows]
    # sign-macos is skipped while SIGN_MACOS is off; a failed or cancelled
    # job stops the release.
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled()
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed attestation per file (Sigstore, OIDC).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only what reached main is released: a tag on any other commit stops
      # here.
      - name: the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${GITHUB_REF_NAME} ($GITHUB_SHA) is not on main"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: checksums
        run: (cd dist && sha256sum veilq-* veilq.exe > SHA256SUMS && cat SHA256SUMS)
      - name: build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/veilq-*
            dist/veilq.exe
            dist/SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_MACOS: ${{ vars.SIGN_MACOS }}
          SIGN_WINDOWS: ${{ vars.SIGN_WINDOWS }}
        # --verify-tag: only a tag that exists in the repository is released.
        run: |
          sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
          unsigned=""
          [ "$SIGN_WINDOWS" = true ] || unsigned="Windows"
          [ "$SIGN_MACOS" = true ] || unsigned="${unsigned:+$unsigned and }macOS"
          if [ -n "$unsigned" ]; then
            printf '\n**Not signed yet (%s):** Windows SmartScreen or macOS Gatekeeper may warn on the first start. Each file has a build provenance attestation (`gh attestation verify <file> --repo %s`); see the README.\n' \
              "$unsigned" "$GITHUB_REPOSITORY" >> release-notes.md
          fi
          printf '\n**Full changelog:** https://github.com/%s/blob/%s/CHANGELOG.md\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "veilq ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
