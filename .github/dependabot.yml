# Updates for the pinned actions and the Rust dependencies: one pull request
# per ecosystem and week for minor and patch versions (actions: majors too).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [major, minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the native compiler and no longer ships lib/tsc,
      # which vue-tsc 3.3 loads (ERR_PACKAGE_PATH_NOT_EXPORTED). Lift this
      # once vue-tsc supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=7"]
