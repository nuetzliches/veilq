# The hand-written patches of the detection (#161): each rule written for
# one case, with the case it protects and the corpus files that hold it.
#
# `veilq-eval ablate eval --ner --ocr` reads the corpus once per patch with
# it off and prints what changed; `ablation` records the last verdict:
# `guards` (switching it off loses a value or adds a false finding), `dead`
# (nothing changes: the patch does nothing today, or its case is missing
# from the corpus) or `unmeasured`. A patch is removed only when a
# measurement says the structure carries its case (#161).
#
# Last ablation: 2026-11-25 on the corpus of seed 1 as of main c3bf6b4,
# scan, NER and OCR, run per format (`--only de/png` and so on). 16 guard
# something, 50 change nothing in the corpus. `column-head-context` and
# `context:intl.name-column` guard values in `de/png/list` and make the 9
# false findings of `de/png/desk`.
#
# `id` is the name `veilq_core::patch` knows it by; a context boost of a
# locale's pattern is `context:<locale>.<name>`. The cases are synthetic.

# --- detect/mod.rs ----------------------------------------------------------

[[patch]]
id = "not-context"
where = "crates/veilq-core/src/detect/mod.rs: NOT_CONTEXT, has_context"
what = "a context word at the start of these words gives no boost"
origin = ["#133"]
case = "Personalisieren, Namespace, Steuerung, Bytes"
corpus = []
ablation = "dead"

[[patch]]
id = "compound-tail"
where = "crates/veilq-core/src/detect/mod.rs: COMPOUND_TAIL, has_context"
what = "a context word of five letters or more also counts at the end of a compound"
origin = ["ADR-0037", "#57"]
case = "Senderkonto, Empfängerkonto before an IBAN"
corpus = ["de/png/transfer-1.png"]
ablation = "dead"

[[patch]]
id = "ocr-checksum-penalty"
where = "crates/veilq-core/src/detect/mod.rs: OCR_CHECKSUM_PENALTY, candidates"
what = "a failed checksum in OCR text costs 0.15, not 0.3"
origin = ["ADR-0037", "#57"]
case = "DE8937040044053201300, one 0 lost in reading"
corpus = ["de/png/transfer-1.png"]
ablation = "dead"

[[patch]]
id = "ocr-only-rules"
where = "crates/veilq-core/src/detect/mod.rs: OCR_ONLY, candidates"
what = "name-cut, address-glued and address-lines-glued run on OCR text only"
