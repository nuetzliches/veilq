[[patch]]
id = "context:intl.name-field"
where = "crates/veilq-core/locales/intl/patterns.toml: name-field"
what = "0.35, +0.5 under a name's or a party's key or column"
origin = ["M1", "ADR-0042", "ADR-0059"]
case = "Mira Albers under the column name"
corpus = ["de/csv/customers-1.csv", "de/json/customer-1.json", "en/csv/customers-1.csv"]
ablation = "dead"

[[patch]]
id = "context:intl.name-column"
where = "crates/veilq-core/locales/intl/patterns.toml: name-column"
what = "0, +0.85: one word alone under a name's or a party's column"
origin = ["ADR-0042", "#71"]
case = "a surname under Gegner; a side bar's entries under Gläubiger (false)"
corpus = ["de/png/list-1.png", "de/png/desk-1.png"]
ablation = "guards"
