# The gate with NER (ADR-0022): `veilq-eval check eval --ner --gate
# eval/gate-ner.toml`, on a machine where `veilq models fetch ner` ran.
# Names without a word that marks them are NER's to find: no exception for
# PERSON here.
#
# With `--ocr` as well (ADR-0023; `veilq models fetch ocr` and `pdf`), the
# pictures under `de/png`, `de/jpeg`, `de/gif` and `de/pdf` are read too:
# a value counts as covered when the boxes found cover 98 % of its ink.
[recall]
default = 0.98

[precision]
# A version number after `client=` reads as an IP address (see gate.toml).
min = 0.97
