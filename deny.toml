# cargo-deny (CI job `deny`): dependencies keep to permissive licences
# (AGENTS.md: MIT-compatible only) and come from crates.io.

[graph]
all-features = true
# The targets release.yml ships, and only those: a crate another platform
# would pull in (wry's Android and Linux dependencies, where veilq does not
# use wry) is not shipped and not checked.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
]
# Not shipped: wry's Linux build pulls it in (dirs → dirs-sys), but veilq
# uses wry on Windows only (ADR-0029); cargo-deny lists a crate's
# dependencies for every target above once the crate is in the graph.
exceptions = [{ name = "option-ext", allow = ["MPL-2.0"] }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace crates depend on each other by path (not published).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# A warning in CI; the release workflow requires a clean check.
yanked = "warn"
# Each ignore says why it does not reach what veilq runs, and when it goes.
ignore = [
    # crypto-bigint 0.5 (timing): reached only through age's P-256 code
    # (p256, hpke). veilq encrypts mappings to X25519 recipients only
    # (crates/veilq-core/src/mapping.rs parses `age::x25519::Recipient`), so
    # no secret goes through it. age 0.12.1 is the newest age; drop this
    # once age moves to crypto-bigint 0.7.
    { id = "RUSTSEC-2026-0387", reason = "P-256 code of age that veilq never calls; X25519 only" },
    # Unmaintained, no successor; build time only: proc macros.
    { id = "RUSTSEC-2026-0374", reason = "basic-toml: build-time dependency of age's i18n macros" },
    { id = "RUSTSEC-2024-0436", reason = "paste: proc macro of tokenizers, build time only" },
    # Unmaintained; in veilq-eval only (the corpus generator draws its text
    # with ab_glyph), not in veilq.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: veilq-eval's corpus generator only" },
    # Unmaintained proc macro of glib/gtk, which tao and wry use on Linux
    # only; veilq uses them on Windows only (ADR-0029), so it is in no build
    # veilq ships. cargo-deny lists their Linux dependencies once they are
    # in the graph for Windows.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: gtk's macros, Linux side of tao/wry that veilq does not build" },
]
