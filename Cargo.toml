[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nuetzliches/veilq"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
veilq-core = { path = "crates/veilq-core" }

[workspace.lints.rust]
# `deny`, not `forbid`: the desktop module's four Windows calls allow it
# for themselves (ADR-0027).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
