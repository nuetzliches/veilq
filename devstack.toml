# devstack stack file. Reference: https://github.com/nuetzliches/devstack/blob/v0.46.0/docs/stack-file.md
# Validate after every edit: `devstack check --compose`.
#
# Two services, both native: the web UI's dev server against the in-browser
# mock (hot reload, synthetic data), and `veilq ui` itself with the UI built
# and embedded, against the real engine. veilq has no infrastructure (no
# database, no queue), so there is no `[compose.*]` group, no seed or reset
# command, and no background workers.
#
# Windows: the first build of `veilq` compiles the workspace in the lane's
# snapshot from scratch. If it dies with os error 1455 (paging file), start the
# daemon with CARGO_BUILD_JOBS=2 in the environment.

version = 1

[stack]
name     = "veilq"
requires = "0.44.0"   # link = { from_log }
reviewed = "0.46.0"   # the devstack this file was last brought up to date with

# The UI against src/api/mock.ts: for working on the UI, no Rust build.
[services.ui]
kind       = "devserver"
cwd        = "ui"
run        = "npx vite --mode mock --host 127.0.0.1 --port {port} --strictPort"
port       = 4761
health     = { http = "/", timeout = "90s" }
restart_on = ["ui/vite.config.ts", "ui/package.json", "ui/tsconfig*.json", "ui/env.d.ts"]
tunnel     = false
# A lane's copy has no node_modules (ignored files are not copied); `link`
# makes the copy's available in the lane's worktree too (stop the lane before
# `git worktree remove`).
prepare    = { run = "npm ci", inputs = ["ui/package-lock.json"], outputs = ["ui/node_modules"], link = ["ui/node_modules"] }

# `veilq ui` with the UI embedded (build.rs takes ui/dist). It prints its URL
# with its token; `link` makes that URL the dashboard's link, so the button
# opens the UI logged in. `--token-file` keeps the token across builds
# (ADR-0021): an open tab goes on working after a change went live. The file
# is under target/, never committed; delete it for a new token. `--origin` lets
# the server accept requests through devstack's proxy on the fixed port, and
# makes the printed URL name that port.
#
# `cargo install --root` rather than `cargo build`: it puts just the binary in
# a directory of its own, so `output` copies one file instead of target/debug.
# `--target-dir target` keeps the snapshot's incremental state warm.
[services.veilq]
build   = "npm --prefix ui run build && cargo install --path crates/veilq --bin veilq --debug --locked --force --target-dir target --root target/devstack/veilq"
output  = "target/devstack/veilq/bin"
run     = "{artifact}/veilq ui --root {repo} --port {port} --origin {service.veilq.url} --token-file {repo}/target/devstack/ui-token --no-open"
port    = 4760
# Answers once the server listens; there is nothing else it waits for.
health  = { http = "/healthz", timeout = "60s" }
# Never public: the UI reads files under the repository.
tunnel  = false
link    = { from_log = 'veilq ui: (http://\S+)' }
watch   = [
  "crates/**", "Cargo.toml", "Cargo.lock",
  "ui/src/**", "ui/public/**", "ui/index.html", "ui/vite.config.ts", "ui/tsconfig*.json", "ui/env.d.ts",
]
# Same `run`, `cwd`, inputs and outputs as `ui`'s: both share one store entry,
# and in a lane's copy the second to start uses what the first made. Keep the
# two alike.
prepare = { run = "npm ci", cwd = "ui", inputs = ["ui/package-lock.json"], outputs = ["ui/node_modules"] }

# Where `devstack skills install` writes the agent skills. The repository is
# worked on with Claude Code (CLAUDE.md, .mcp.json).
[agents]
skills = [".claude/skills"]
